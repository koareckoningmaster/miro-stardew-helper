<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pip, the trim finder</title>
    <!-- Headless entry point: Miro loads this invisibly whenever the board opens. -->
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  </head>
  <body>
    <script>
      // Where Pip pops up on his own, every time someone opens or reloads a board:
      //   'home' = only on boards where someone switched on "Show Pip to everyone who opens this board"
      //   'all'  = on every board in a team that installed him
      //   'none' = never; people open him from the cap icon in the apps toolbar
      const AUTO_OPEN = 'home';
      const HOME_KEY = 'pipHome'; // the board-level setting saved by the switch in Pip's panel

      async function isHomeBoard() {
        try {
          return (await miro.board.getAppData(HOME_KEY)) === true;
        } catch {
          return false;
        }
      }

      async function openPip(reason) {
        try {
          // Another app's panel can block ours; canOpenPanel() tells us before we try.
          if (!(await miro.board.ui.canOpenPanel())) return false;
          // `reason` lets the panel pick a first-visit greeting vs. a welcome-back line.
          await miro.board.ui.openPanel({ url: 'app.html', data: { reason } });
          return true;
        } catch (err) {
          console.warn('[Pip] Could not open the panel:', err);
          return false;
        }
      }

      // The cap icon in the apps toolbar always brings Pip back.
      miro.board.ui.on('icon:click', async () => {
        if (!(await openPip('icon'))) {
          await miro.board.notifications.showInfo('A side panel is already open. Close it to talk to Pip.');
        }
      });

      async function greetOnArrival() {
        if (AUTO_OPEN === 'none') return;
        if (AUTO_OPEN === 'home' && !(await isHomeBoard())) return; // not his home board: stay out of the way
        await new Promise((resolve) => setTimeout(resolve, 1500)); // let the board UI finish loading
        if (!(await openPip('arrival'))) {
          // If a panel is already open, greet with a toast instead.
          await miro.board.notifications.showInfo(
            'Pip: Hello! What can I help you find today? Click the cap icon in the apps toolbar to search.'
          );
        }
      }

      greetOnArrival();
    </script>
  </body>
</html>
